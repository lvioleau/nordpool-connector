# Nord Pool connector configuration.
#
# Values may embed ${VAR} (required — load fails if unset) or ${VAR:-default} (use the
# default when unset). Literals pass through. ${VAR} resolves from the process environment.
# Secrets are never stored here: the file names the variable; the value is injected into the
# environment at deploy time (Terraform in prod, scripts/dev-stack.sh in dev). The file
# path is the NORDPOOL_CONFIG env var (default: ./nordpool.ini).

[connector]
ws_host                   = ${NORDPOOL_MARKET_DATA_API_WEBSOCKET_HOST}
ws_port                   = ${NORDPOOL_MARKET_DATA_API_WEBSOCKET_PORT:-443}
# One delivery area as its ENTSO-E EIC code, or a comma-separated list to reconstruct depth
# for several (e.g. `10YFI-1--------U, 10YSE-4--------9`).
# The contract feed and the archive S3 partition use the first (primary) area.
delivery_area             = 10YFR-RTE------C
ping_every_secs           = 10
pong_timeout_secs         = 20
# Reconnect when no server frame (heartbeat or data) arrives for this many announced
# heartbeat intervals — WS pongs only prove the socket is alive, this proves the feed is.
heartbeat_timeout_factor  = 5
read_timeout_ms           = 100
write_timeout_secs        = 10
handshake_timeout_secs    = 10
connected_timeout_secs    = 15
token_http_timeout_secs   = 10
token_refresh_margin_secs = 60
initial_backoff_ms        = 500
max_backoff_secs          = 30
backoff_reset_after_secs  = 30
session_reconnect         = daily

[connector.auth]
token_url                 = ${NORDPOOL_MARKET_DATA_API_PROTOCOL}://${NORDPOOL_MARKET_DATA_API_HOST}${NORDPOOL_MARKET_DATA_API_TOKEN_URI}
client_id                 = ${NORDPOOL_MARKET_DATA_API_CLIENT_ID}
client_secret             = ${NORDPOOL_MARKET_DATA_API_CLIENT_SECRET}
scope                     = ${NORDPOOL_MARKET_DATA_API_SCOPE}
username                  = ${NORDPOOL_MARKET_DATA_API_USERNAME}
password                  = ${NORDPOOL_MARKET_DATA_API_PASSWORD}

# DogStatsD export is always installed. dogstatsd_addr is required; it defaults here to
# 127.0.0.1:8125 (DogStatsD is UDP, so with no local agent the packets drop silently).
# tags (key:value, comma-separated) are stamped on every nordpool.* series alongside the built-in
# version:. Agent-level tags apply to every series through a shared agent, so an app-identifying
# tag belongs on the client. Empty = none.
[connector.metrics]
dogstatsd_addr            = ${DOGSTATSD_ADDR:-127.0.0.1:8125}
tags                      = ${NORDPOOL_METRICS_TAGS:-env:dev, service:nordpool-connector, exchange:nordpool-test, delivery_area:10YFR-RTE------C}
book_state_period_secs    = 10

# Raw-frame archive (always on): dumps each frame's wire bytes to disk as TFRecord-framed
# protobuf records, one rotating segment per frame type, gzipped when a segment finalizes.
# dir is required and deliberately has no default: the container image declares ARCHIVE_DIR
# (and creates the dir it names), a native run sets it in devenv.local.nix. An unset one
# fails config load instead of resolving to a path only the container can write. Segments
# rotate at block_size_mib, when a snapshot starts a fresh file, or once open for
# segment_max_age_secs (every arriving frame sweeps all types' open segments, so the busy
# feeds close the quiet feeds' aged ones; no new file opens until that type gets data —
# bounds how long a frame sits in an unshipped segment).
[connector.archive]
dir                       = ${ARCHIVE_DIR}
block_size_mib            = 32
segment_max_age_secs      = 900
fsync_interval_secs       = 5
# How long a refusing disk is ridden out before frames start being lost: the budget spent
# retrying one frame, and the wait before probing the disk again after giving one up. The
# retrying happens on the archive's worker thread, so frames arriving meanwhile queue up (see
# queue_capacity) and land when the disk returns — a fault shorter than this costs nothing.
# Keep it well under the queue's depth in seconds, or the buffer overflows while the writer is
# still hoping. Shutdown is not delayed by it; a stopping process abandons the wait.
write_retry_secs          = 30
# Warn when the volume holding `dir` drops below this. Nothing bounds the staging dir: if uploads
# stop shipping, the backlog grows until an archive write fails for want of space — the one archive
# failure still fatal to the process. This only makes that approach visible in time to act — the
# free-space gauge is published regardless, so
# alert on the metric and treat the log as the in-process signal. Sized well clear of what the
# writer holds open (one block_size partial per subscribed frame type, plus a gzip temp while one
# finalizes); raise it toward a day's unshipped volume if the volume is large. 0 warns never.
min_free_space_mib        = 2048
# Frames the archive worker may fall behind by. Depth divided by the arrival rate is the
# disk stall this absorbs losslessly: localview runs ~117 frames/s over a day and ~172/s at
# its afternoon peak, so 16384 covers ~95s at peak. Costs
# capacity x frame size in memory, roughly 16 MiB here.
queue_capacity            = 16384
# Bounds how long the driver may block on a full archive queue, and so how long a stalled
# disk may hold up the live feeds — the driver is not receiving while it waits. The queue
# above is what absorbs a writer that is merely behind; by the time it is full the writer is
# stuck, and waiting on it only passes the outage on to clients.
enqueue_timeout_ms        = 250
poll_interval_ms          = 1000

# Optional S3 upload — the shipper, as opposed to the writer's keys above. An empty uri (the
# default), or dropping this whole section, keeps the archive local-only; every other key here is
# required once a uri is set. s3://bucket/prefix in ECS (creds via the task role), file:///abs/path
# in dev. Each scan ships the finalized segments and deletes the local copies — the object store is
# the archive of record, the local dir a staging area. Open .partials are never uploaded;
# segment_max_age_secs bounds hard-kill loss to ~that age plus one scan.
[connector.archive.upload]
uri                       = ${ARCHIVE_UPLOAD_URI:-}
scan_interval_secs        = 300
# How many segments one pass uploads at once. Each in-flight upload holds its whole segment in
# memory, so this bounds the pass's peak footprint — without it, a backlog built up during a
# store outage is read in all at once. At least 1.
concurrency               = 8
# A segment that fails is retried after one scan interval, then twice that, and so on up to this
# ceiling — so a store outage doesn't cost a full re-read and re-PUT of the whole backlog every
# scan, while a failing segment is still retried often enough to recover on its own.
max_backoff_secs          = 3600
# Per-PUT retry budget for the S3 backend (object_store). Bounds how long one unreachable-store
# PUT blocks before the error surfaces — keep it short locally so a Ctrl-C isn't held up draining
# to a stopped MinIO. The scan loop re-ships failed files next pass regardless. file:// ignores it.
max_retries               = ${ARCHIVE_UPLOAD_MAX_RETRIES:-10}
retry_timeout_secs        = ${ARCHIVE_UPLOAD_RETRY_TIMEOUT_SECS:-45}
# Deadline for the drain on shutdown, which attempts every pending segment whatever its backoff:
# the staging dir is ephemeral, so a segment not attempted then is lost rather than deferred. This
# bounds what that costs when the store is unreachable. It runs before [server] shutdown_grace_secs,
# so keep the two together inside the container's stop timeout (ECS stopTimeout, 30s by default).
shutdown_grace_secs       = 10
# Static S3 object tags (x-amz-tagging), comma-separated key=value (not the key:value of
# [connector.metrics] tags) — the only tags a PUT carries. Empty sends no tagging header, which also
# means the task role needs no s3:PutObjectTagging.
# Keep keys/values to alphanumerics + `+ - = . _ : /`.
# tags                      = delivery_area_eic=${DELIVERY_AREA:-10YFR-RTE------C}

# The gRPC market-data feeds (depth, contracts, statistics). An empty listen_addr (the default
# below) disables them, and with them the in-process order-book reconstruction.
[server]
listen_addr               = ${GRPC_LISTEN_ADDR:-}
broadcast_capacity        = 4096
depth                     = ${GRPC_DEPTH:-20}
max_subscribers           = ${GRPC_MAX_SUBSCRIBERS:-10}
# Probe idle client connections (HTTP/2 PING + TCP keepalive) so a silently dead client is
# closed and its subscriber slot freed even when its feed has nothing to send.
keepalive_interval_secs   = 30
keepalive_timeout_secs    = 20
# On shutdown, how long main waits for the graceful drain (every subscriber stream ended with
# a terminal UNAVAILABLE, in-flight requests completed) before exiting anyway.
shutdown_grace_secs       = 10
