[package]
name = "nordpool-depth-replay"
version = "0.1.0"
edition = "2024"

[dependencies]
nordpool-connector = { path = "../connector" }
nordpool-marketdata = { path = "../marketdata" }
prost = "0.13"
# The domain's timestamps are `DateTime<Utc>`; the Parquet columns stay unix nanos.
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
crossbeam-channel = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arrow = "59.0.0"
parquet = { version = "59.0.0", features = ["arrow"] }
# Read archive segments from S3 / file:// / local paths. Pinned to match the connector's
# uploader (object_store is pre-1.0; a minor bump can break). tokio drives the async object
# store from this otherwise-synchronous batch tool; futures for the list stream.
object_store = { version = "=0.13.2", features = ["aws", "tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
futures = "0.3"
url = "2"
# Gunzip finalized archive segments; stays in step with the connector's gzip-on-finalize.
flate2 = "1"
