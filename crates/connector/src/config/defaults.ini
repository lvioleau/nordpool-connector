# Built-in default configuration, compiled into the binary (include_str!) and parsed by
# config::get() when main never called config::init() — i.e. in unit tests. Production loads
# nordpool.ini instead. This file, not any impl Default, is the single home of the built-in
# defaults; keep it in step with what the tests expect. Sections gated by an empty sentinel
# (server listen_addr) stay off; archive dir is a throwaway local path (dir is required, so it
# cannot be empty here).

[connector]
ws_host                   =
ws_port                   = 0
delivery_area             = 10YFR-RTE------C
ping_every_secs           = 10
pong_timeout_secs         = 20
heartbeat_timeout_factor  = 5
read_timeout_ms           = 100
write_timeout_secs        = 10
handshake_timeout_secs    = 10
connected_timeout_secs    = 15
token_http_timeout_secs   = 10
token_refresh_margin_secs = 60
initial_backoff_ms        = 500
max_backoff_secs          = 30
backoff_reset_after_secs  = 30
session_reconnect         = off

[connector.auth]
token_url                 =
client_id                 =
client_secret             =
scope                     =
username                  =
password                  =

[connector.metrics]
dogstatsd_addr            = 127.0.0.1:8125
tags                      = service:nordpool-connector
book_state_period_secs    = 30

[connector.archive]
dir                       = /tmp/nordpool-archive
block_size_mib            = 64
segment_max_age_secs      = 900
min_free_space_mib        = 2048
fsync_interval_secs       = 5
write_retry_secs          = 30
queue_capacity            = 16384
enqueue_timeout_ms        = 250
poll_interval_ms          = 1000

# The shipper. Off here on its empty uri sentinel; the rest are the values a run that turns it on
# gets, since every key in this section is required once the gate is open.
[connector.archive.upload]
uri                       =
scan_interval_secs        = 300
concurrency               = 8
max_backoff_secs          = 3600
max_retries               = 10
retry_timeout_secs        = 180
shutdown_grace_secs       = 10
tags                      =

[server]
listen_addr               =
broadcast_capacity        = 4096
depth                     = 20
max_subscribers           = 10
keepalive_interval_secs   = 30
keepalive_timeout_secs    = 20
shutdown_grace_secs       = 10
